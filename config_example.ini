# =====================================================
# Settings for weekly_report.py
# 1. Make a copy of this file and rename the copy to: config.ini
# 2. Fill in your real details in config.ini
# 3. Never upload config.ini to GitHub (it has your passwords)
# =====================================================

[mysql]
host = 127.0.0.1
port = 3306
user = root
password = YOUR_MYSQL_ROOT_PASSWORD
database = coffee_shop

[email]
# Change to yes once your Gmail App Password is set up
send_email = no
sender = your.email@gmail.com
app_password = xxxx xxxx xxxx xxxx
recipient = your.email@gmail.com
